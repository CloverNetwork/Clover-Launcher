[workspace]
resolver = "3"
members = ["src-tauri", "crates/clover-core"]

[workspace.package]
version = "0.0.3-pre"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
