# Releases Clover for macOS, Windows and Linux.
#
# Start it from the Actions tab (Release → Run workflow) with the new version, such as
# 0.2.0. It sets that version in package.json, Cargo.toml and tauri.conf.json, commits and
# tags it, builds every platform, and publishes a GitHub release with the installers and
# the updater's latest.json. Installed copies then offer the update.
#
# Pushing a tag such as v0.2.0 yourself also works; the version files must match it then.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0 (no leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (installed copies won't update to it)"
        type: boolean
        default: false
      draft:
        description: "Keep the release as a draft to publish by hand"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' isn't a version like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Pick a higher version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Set the version, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only the first "version" in each file is the app's own.
          sed -i -E "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$VERSION\"/" package.json src-tauri/tauri.conf.json
          sed -i -E "0,/^version = \"[^\"]*\"/s//version = \"$VERSION\"/" Cargo.toml
          # Cargo.lock lists the workspace's own crates with their version too.
          for crate in clover-core clover-launcher; do
            sed -i -E "/^name = \"$crate\"$/{n;s/^version = \"[^\"]*\"/version = \"$VERSION\"/}" Cargo.lock
          done
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rerunning a version whose release was deleted finds the files already set.
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      # Signing and notarization run only when the Apple secrets exist; otherwise the Mac
      # app is unsigned and people have to allow it in System Settings.
      - name: Apple signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate; the Mac app won't be signed."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$name=${!name}" >> "$GITHUB_ENV"
            done
          else
            echo "No Apple ID secrets; the Mac app will be signed but not notarized."
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # RPM and MSI only take plain numbers like 1.2.3, so a pre-release such as 1.2.3-beta.1
      # skips them; the AppImage, .deb and NSIS installer (which the updater uses) still build.
      - name: Pick installers
        id: bundles
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=""
          if [[ "$TAG" == *-* ]]; then
            case "$PLATFORM" in
              ubuntu-*) args="--bundles deb,appimage" ;;
              windows-*) args="--bundles nsis" ;;
            esac
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs updates so installed copies trust them. Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Built-in CurseForge key, if CurseForge approved one. Optional.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Another Discord application than Clover's own. Optional.
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Clover Launcher ${{ needs.prepare.outputs.tag }}
          generateReleaseNotes: true
          releaseDraft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.bundles.outputs.args }}
